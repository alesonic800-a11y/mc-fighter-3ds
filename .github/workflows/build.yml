name: Compilar 3DS

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Instalar herramientas necesarias y compilar
        run: |
          apt-get update && apt-get install -y curl zip
          
          # Descargar makerom usando curl (siguiendo redirecciones)
          curl -L -o makerom_linux.zip https://github.com
          unzip makerom_linux.zip
          chmod +x makerom
          mv makerom /usr/local/bin/

          # Descargar bannertool usando curl (siguiendo redirecciones)
          curl -L -o bannertool.zip https://github.com
          unzip -j bannertool.zip linux-x86_64/bannertool
          chmod +x bannertool
          mv bannertool /usr/local/bin/

          # Ejecutar la compilacion
          make cia
          make 3dsx

      - name: Subir instalables compilados
        uses: actions/upload-artifact@v4
        with:
          name: moncloas-fighter-3ds
          path: |
            *.cia
            *.3dsx
