name: Compilar 3DS

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Instalar makerom y bannertool oficiales
        run: |
          apt-get update
          apt-get install -y 3ds-makerom 3ds-bannertool

      - name: Compilar juego
        run: |
          make cia
          make 3dsx

      - name: Subir instalables compilados
        uses: actions/upload-artifact@v4
        with:
          name: moncloas-fighter-3ds
          path: |
            *.cia
            *.3dsx
